<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #111827;
      background: #fff;
    }

    /* ── Header ── */
    #main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .header-title {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 17px;
      color: #9ca3af;
      padding: 2px 4px;
      border-radius: 4px;
    }
    #settings-btn:hover { color: #6b7280; }

    /* ── Panels ── */
    .panel { display: none; padding: 16px; }

    /* ── Form controls ── */
    .field-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="password"],
    input[type="url"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      color: #111827;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.15); }
    .hint { font-size: 11px; color: #9ca3af; margin-top: 4px; }

    /* ── Buttons ── */
    .btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: filter .15s;
      text-align: center;
    }
    .btn:hover { filter: brightness(.94); }
    .btn-primary  { background: #6366f1; color: #fff; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-sm { width: auto; display: inline-block; padding: 7px 14px; font-size: 13px; }

    /* ── Page card ── */
    .page-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 11px 13px;
      margin-bottom: 14px;
    }
    #page-title {
      font-weight: 500;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    #page-url {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Loading ── */
    #panel-loading {
      padding: 36px 16px;
      text-align: center;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin .75s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-status { font-size: 13px; color: #6b7280; }

    /* ── Results ── */
    #screenshot-preview {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
      display: block;
      border: 1px solid #e5e7eb;
    }
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #ede9fe;
      color: #6366f1;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 11px;
    }
    .scroll-area {
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .result-field { margin-bottom: 9px; }
    .divider { height: 1px; background: #e5e7eb; margin: 12px 0; }
    .row-btns { display: flex; gap: 8px; align-items: center; }
    .row-btns .btn-primary { flex: 1; }

    /* ── Success ── */
    #panel-success {
      padding: 36px 16px;
      text-align: center;
    }
    .success-icon  { font-size: 38px; margin-bottom: 10px; }
    .success-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
    .success-sub   { color: #6b7280; font-size: 13px; margin-bottom: 20px; }

    /* ── Error banner ── */
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 8px 11px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="main-header">
    <div class="header-title">
      <span>✈️</span> Travel Capture
    </div>
    <button id="settings-btn" title="Settings">⚙️</button>
  </div>

  <!-- Settings -->
  <div class="panel" id="panel-settings">
    <div class="field-group">
      <label>Claude API Key</label>
      <input type="password" id="api-key" placeholder="sk-ant-api03-...">
      <p class="hint">From console.anthropic.com → API Keys</p>
    </div>
    <div class="field-group">
      <label>Travel App Endpoint</label>
      <input type="url" id="app-endpoint" placeholder="https://yourapp.com/api/reservations">
      <p class="hint">POST destination for captured reservations</p>
    </div>
    <div id="settings-error" class="error-msg" style="display:none"></div>
    <button class="btn btn-primary" id="save-settings-btn">Save & Continue</button>
  </div>

  <!-- Capture -->
  <div class="panel" id="panel-capture">
    <div class="page-card">
      <div id="page-title">Loading…</div>
      <div id="page-url"></div>
    </div>
    <button class="btn btn-primary" id="capture-btn">📸  Capture This Page</button>
    <div id="capture-error" class="error-msg" style="display:none"></div>
  </div>

  <!-- Loading -->
  <div class="panel" id="panel-loading">
    <div class="spinner"></div>
    <div id="loading-status">Capturing screenshot…</div>
  </div>

  <!-- Results -->
  <div class="panel" id="panel-results">
    <div id="type-badge" class="type-badge"></div>
    <img id="screenshot-preview" alt="Page screenshot">
    <div class="scroll-area" id="results-fields"></div>
    <div class="divider"></div>
    <div class="row-btns">
      <button class="btn btn-secondary btn-sm" id="back-btn">← Retake</button>
      <button class="btn btn-primary" id="send-btn">Send to Travel App →</button>
    </div>
    <div id="results-error" class="error-msg" style="display:none"></div>
  </div>

  <!-- Success -->
  <div class="panel" id="panel-success">
    <div class="success-icon">✅</div>
    <div class="success-title">Reservation Saved!</div>
    <div class="success-sub">It's now in your travel app.</div>
    <button class="btn btn-secondary" id="capture-again-btn">Capture Another Page</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
